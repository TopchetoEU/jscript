name: "tagged-release"

on:
  push:
    tags:
      - "*"

jobs:
  tagged-release:
    name: "Tagged Release"
    runs-on: "ubuntu-latest"

    steps:
      - name: Clone repository
        uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-disabled: true
          gradle-version: "8.10"
      - name: Build
        run: gradle build
      - name: Publish
        run: gradle publish
        env:
          ACCESS_TOKEN: "${{github.token}}"
          REPO_URL: "${{github.api_url}}/packages/${{github.repository_owner}}/maven"
      - name: Create release
        uses: "https://gitea.com/actions/gitea-release-action@main"
        with:
          files: |
            LICENSE
            build/libs/*.jar